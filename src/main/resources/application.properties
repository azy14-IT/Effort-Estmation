spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_tracking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Let Spring Boot detect dialect automatically for MySQL 8
# Let Spring Boot detect dialect automatically for MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# View
spring.thymeleaf.cache=false

# Server
# Use Render's PORT environment variable, default to 8080 if not set
server.port=${PORT:8080}
