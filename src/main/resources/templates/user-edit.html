<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit User - WorkTrack Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">WorkTrack Pro</div>
            <nav>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/projects" class="nav-link">Projects</a>
                <a href="/tasks" class="nav-link">Tasks</a>
                <a href="/users" class="nav-link active" th:if="${session.user.role.name == 'Super Admin'}">Users</a>
            </nav>
            <div class="user-profile">
                <span>Admin User</span> • <a href="/logout">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2>Edit User</h2>
            </div>

            <div class="card" style="max-width: 800px;">
                <form action="/users/update" method="post">
                    <input type="hidden" name="id" th:value="${targetUser.id}" />

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="firstName" th:value="${targetUser.firstName}" required />
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="lastName" th:value="${targetUser.lastName}" required />
                        </div>
                    </div>

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" th:value="${targetUser.email}" required />
                        </div>
                        <div class="form-group">
                            <label>Budget (₹ / hr)</label>
                            <input type="number" step="0.01" name="hourlyRate" th:value="${targetUser.hourlyRate}"
                                placeholder="e.g. 500" />
                        </div>
                    </div>

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label>Role</label>
                            <select name="roleId" required>
                                <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"
                                    th:selected="${targetUser.role != null and targetUser.role.id == role.id}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <select name="departmentId" required>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"
                                    th:selected="${targetUser.department != null and targetUser.department.id == dept.id}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="isActive">
                            <option value="true" th:selected="${targetUser.isActive == true}">Active</option>
                            <option value="false" th:selected="${targetUser.isActive == false}">Inactive</option>
                        </select>
                    </div>

                    <div class="flex" style="gap: 1rem; margin-top: 2rem;">
                        <button type="submit" class="btn">Update User</button>
                        <a href="/users" class="btn btn-secondary"
                            style="text-align:center; display:inline-block; text-decoration:none;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
