<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Change Password - WorkTrack Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">WorkTrack Pro</div>
            <nav>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/projects" class="nav-link">Projects</a>
                <a href="/tasks" class="nav-link">Tasks</a>
                <a href="/users" class="nav-link"
                    th:if="${session.user.role != null and session.user.role.name == 'Super Admin'}">Users</a>
            </nav>
            <div class="user-profile">
                <div style="margin-bottom: 5px;">
                    <span th:text="${session.user.firstName} + ' ' + ${session.user.lastName}">User</span> • <a
                        href="/logout">Logout</a>
                </div>
                <a href="/change-password" style="font-size: 0.85rem; color: #cbd5e1; text-decoration: none;">Change
                    Password</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2>Change Password</h2>
            </div>

            <div class="card" style="max-width: 500px; margin: 2rem auto;">
                <div th:if="${error}" class="alert alert-error"
                    style="background-color: #fef2f2; color: #ef4444; padding: 10px; border-radius: 4px; margin-bottom: 15px;"
                    th:text="${error}"></div>
                <div th:if="${success}"
                    style="background-color: #ecfdf5; color: #10b981; padding: 10px; border-radius: 4px; margin-bottom: 15px;"
                    th:text="${success}"></div>

                <form action="/change-password" method="post">
                    <div class="form-group">
                        <label>Current Password</label>
                        <div style="position: relative;">
                            <input type="password" id="oldPassword" name="oldPassword" required
                                style="width: 100%; padding-right: 40px;" />
                            <span class="password-toggle" onclick="togglePassword('oldPassword')"
                                style="cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #64748b;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <div style="position: relative;">
                            <input type="password" id="newPassword" name="newPassword" required
                                style="width: 100%; padding-right: 40px;" />
                            <span class="password-toggle" onclick="togglePassword('newPassword')"
                                style="cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #64748b;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn">Update Password</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('svg');
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = "password";
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }
    </script>
</body>

</html>
